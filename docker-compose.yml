services:
  redis:
    image: redis:7.0-alpine
    ports:
      - "6384:6379"
    restart: unless-stopped
    networks:
      - roll_net

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    ports:
      - "8557:8554" 
    restart: unless-stopped
    networks:
      - roll_net

  rtsp_simulator:
    image: jrottenberg/ffmpeg:latest
    volumes:
      - ./datasets/@DSCN0668-reject.MP4:/input/video.mp4 
    command: >
      -re -stream_loop -1 -i /input/video.mp4 
      -c:v libx264 -b:v 5M -maxrate 5M -bufsize 10M 
      -c:a copy -f rtsp rtsp://mediamtx:8554/mystream
    depends_on:
      - mediamtx
    restart: unless-stopped
    networks:
      - roll_net

  roll:
    # build: .
    image: ocr
    command:
      - "uvicorn"
      - "src.api.endpoint:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8005"   
    ports:
      - "8005:8005"
    volumes:
      - ./.env:/app/.env
      - ./src/ai/weights:/app/src/ai/weights
      - .:/app
      - ./src:/app/src
      - ./outputs:/app/outputs
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - mediamtx
    # restart: unless-stopped
    networks:
      - roll_net
      
networks:
  roll_net:
    driver: bridge